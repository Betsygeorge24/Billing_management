{% extends "base.html" %}
{% load static %}
{% block extra_css %}{{ block.super }}<link href="{% static 'css/mobile-admin.css' %}" rel="stylesheet">{% endblock %}
{% block body_class %}mobile-shell{% endblock %}
{% block content %}<div class="phone-frame"><header class="mobile-topbar"><a href="{% url 'mobile_admin_home' %}" class="brand"><span class="brand-mark"><i class="bi bi-bag-check-fill"></i></span><span>Thread & Till</span></a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="icon-button" type="submit" aria-label="Sign out"><i class="bi bi-box-arrow-right"></i></button></form></header><main class="mobile-content">{% block mobile_content %}{% endblock %}</main><nav class="mobile-tabs" aria-label="Mobile navigation"><a class="{% if request.resolver_match.url_name == 'mobile_admin_home' %}active{% endif %}" href="{% url 'mobile_admin_home' %}"><i class="bi bi-grid"></i><span>Dashboard</span></a><a class="{% if request.resolver_match.url_name|slice:':20' == 'mobile_admin_product' or request.resolver_match.url_name == 'mobile_admin_categories' %}active{% endif %}" href="{% url 'mobile_admin_products' %}"><i class="bi bi-box-seam"></i><span>Products</span></a><a class="{% if request.resolver_match.url_name|slice:':17' == 'mobile_admin_bill' %}active{% endif %}" href="{% url 'mobile_admin_bills' %}"><i class="bi bi-receipt"></i><span>Bills</span></a><a class="{% if request.resolver_match.url_name == 'mobile_more' %}active{% endif %}" href="{% url 'mobile_more' %}" {% if request.resolver_match.url_name == 'mobile_more' %}aria-current="page"{% endif %}><i class="bi bi-three-dots"></i><span>More</span></a></nav></div>{% endblock %}
